<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RL_Surf — runs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #14161a; color: #cfd6cf; font: 13px/1.45 'Segoe UI', system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 10px 16px;
           border-bottom: 1px solid #262a30; }
  header h1 { font-size: 16px; color: #eef2ee; font-weight: 600; }
  header a { color: #7fd07f; text-decoration: none; font-size: 12px; }
  #layout { display: flex; height: calc(100vh - 42px); }
  #side { width: 300px; min-width: 300px; overflow-y: auto; border-right: 1px solid #262a30;
          padding: 10px; }
  .runcard { border: 1px solid #2a2f36; border-radius: 6px; padding: 8px 10px;
             margin-bottom: 8px; cursor: pointer; }
  .runcard:hover { border-color: #3d4550; }
  .runcard.sel { border-color: #7fd07f; background: #1a2019; }
  .runcard .name { font-weight: 600; color: #eef2ee; }
  .runcard .meta { color: #8a938a; font-size: 11px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 8px;
           margin-left: 6px; vertical-align: middle; }
  .badge.live { background: #274a27; color: #8f8; animation: pulse 1.6s infinite; }
  .badge.finished { background: #2a2f36; color: #aab; }
  .badge.stale, .badge.interrupted { background: #3a2f24; color: #cb9; }
  @keyframes pulse { 50% { opacity: .55; } }
  #main { flex: 1; overflow-y: auto; padding: 14px 18px; }
  h2 { font-size: 14px; color: #eef2ee; margin: 16px 0 8px; }
  #runhead { font-size: 15px; color: #eef2ee; }
  #runhead .meta { color: #8a938a; font-size: 12px; margin-top: 3px; }
  #charts, .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 12px; }
  .chart { border: 1px solid #262a30; border-radius: 6px; padding: 8px; background: #171a1f; }
  .chart .t { font-size: 11px; color: #9aa39a; margin-bottom: 4px; display: flex;
              justify-content: space-between; }
  .chart .t b { color: #cfe8cf; font-weight: 600; }
  canvas { width: 100%; height: 120px; display: block; }
  #artifacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
               gap: 10px; }
  .art { border: 1px solid #262a30; border-radius: 6px; padding: 8px 10px; background: #171a1f;
         display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .art .s { color: #eef2ee; font-weight: 600; }
  .art .kb { color: #78817a; font-size: 11px; }
  .watch { background: #274a27; color: #b6f0b6; border: 0; border-radius: 5px;
           padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .watch:hover { background: #2f5a2f; }
  .rec { background: #23303f; color: #a9c8ea; border: 0; border-radius: 5px;
         padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 400;
         margin-left: 8px; vertical-align: 2px; }
  .rec:hover { background: #2b3c50; }
  .rec:disabled { opacity: 0.6; cursor: default; }
  #ckpts a { color: #7fb0d0; text-decoration: none; margin-right: 12px; font-size: 12px; }
  .empty { color: #6a736a; padding: 30px 0; }
#permap > summary { cursor: pointer; color: #8b93a2; margin: 10px 0; user-select: none; }
#permap[open] > summary { color: #cdd3dc; }
details.mapgrp { border: 1px solid #262a30; border-radius: 6px; margin: 6px 0;
    background: #14171b; }
  details.mapgrp > summary { cursor: pointer; padding: 7px 10px; color: #cdd3dc;
    user-select: none; font-size: 13px; }
  details.mapgrp > summary .n { color: #6e7681; }
  details.mapgrp[open] > summary { border-bottom: 1px solid #262a30; }
  details.mapgrp .recrow { padding: 7px 10px 0; }
  details.mapgrp .artifacts { display: grid; padding: 8px 10px 10px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>RL_Surf runs</h1>
  <a href="index.html" target="_blank">open 3D viewer ↗</a>
  <span id="refresh" style="color:#5a635a;font-size:11px;margin-left:auto"></span>
</header>
<div id="layout">
  <div id="side"></div>
  <div id="main"><div class="empty">Select a run.</div></div>
</div>
<script src="runs.js"></script>
</body>
</html>
