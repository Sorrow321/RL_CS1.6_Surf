<!--
  Trimmed capture of https://speedrun.eu/maps/<unknown>/records. The site
  answers 200 for ANY stem and renders a generic map page, so "no page" and
  "no records" look identical from the outside - this panel, with no table
  and no "N total" footer, is the only signal there is.
-->

  <nav class="text-sm text-text-muted mb-4" aria-label="Breadcrumb">
    <a href="/maps" data-phx-link="redirect" data-phx-link-state="push" class="text-text-secondary hover:text-accent-1 no-underline">
      Maps
    </a>
    <span class="mx-2">/</span> <span class="text-text-primary">surf_not_a_real_map</span>
  </nav>
  <div class="bg-bg-panel border border-border-theme rounded-lg p-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="font-display text-lg text-text-heading tracking-wide">
          <span class="text-accent-3">surf_not_a_real_map</span>
        </h1>
      </div>
    </div>
  </div>
  <div class="bg-bg-panel border border-border-theme rounded-lg p-8 text-center">
    <p class="text-text-muted font-data text-sm">
        No records found for this map.
    </p>
  </div>
</div></main>
